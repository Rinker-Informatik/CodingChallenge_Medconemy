server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 11m;

    location ^~ /api/office/ { return 404; }

    location /api/ {
        proxy_pass http://backend:3000/;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
