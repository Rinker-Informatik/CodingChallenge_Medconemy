# Overlay for src/backend/docker-compose.yml. Paths are relative to that base file.
services:
  backend:
    ports: !reset []
    environment:
      S3_ENDPOINT: http://storage:9090
  storage:
    image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    command: !reset null
    environment: !override
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: !reset []
    volumes: !override ["s3data:/s3mockroot"]
  mail:
    ports: !override ["127.0.0.1:8026:8025"]
  ui:
    build: ../ui
    depends_on: [backend]
    ports: ["127.0.0.1:8080:80"]
