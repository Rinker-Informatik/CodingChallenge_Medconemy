services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration
      POSTGRES_DB: integration
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../src/backend/deployment/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d integration"]
      interval: 2s
      timeout: 3s
      retries: 30
  storage:
    image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
  mail:
    image: axllent/mailpit:v1.24
  backend:
    build:
      context: ../src/backend
    environment:
      DATABASE_URL: postgres://integration:integration@db:5432/integration
      S3_ENDPOINT: http://storage:9090
      S3_ACCESS_KEY: integration
      S3_SECRET_KEY: integration
      JWT_SECRET: integration-test-secret-not-for-production
      SMTP_HOST: mail
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: integration-admin-password
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_started}
      mail: {condition: service_started}
  test:
    image: node:22-alpine
    profiles: [test]
    environment:
      API_URL: http://backend:3000
      MAIL_URL: http://mail:8025
    volumes:
      - ./share-email.integration.test.mjs:/test/share-email.integration.test.mjs:ro
    command: ["node", "--test", "/test/share-email.integration.test.mjs"]
networks:
  default:
    internal: true

volumes:
  pgdata:
