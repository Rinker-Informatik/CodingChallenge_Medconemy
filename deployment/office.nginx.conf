server {
    listen 81;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Allow only the editor's browser traffic through this public-facing listener.
    location ~ ^/(web-apps/|sdkjs/|sdkjs-plugins/|fonts/|dictionaries/|cache/files/|doc/|[0-9][^/]*/(web-apps/|sdkjs/|fonts/|doc/|themes\.json$)) {
        set $editor http://office:80;
        proxy_pass $editor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location / { return 404; }
}
