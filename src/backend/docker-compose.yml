services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployment/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 3s
      timeout: 3s
      retries: 20
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["s3data:/data"]
  mail:
    image: axllent/mailpit:v1.24
    ports: ["8025:8025"]
  backend:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://demo:demo@db:5432/demo
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: local-demo-secret-change-before-any-real-use
      SMTP_HOST: mail
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: demo-admin-password
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_started}
      mail: {condition: service_started}
volumes:
  pgdata:
  s3data:
